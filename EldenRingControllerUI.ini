[ControllerUI]
; 仅选择手柄图标与控制器示意图，不改变输入行为。
; 键鼠和手柄始终可同时使用；显示哪一类按键图标仍由游戏内设置决定。
; dualsense：DualSense / PS5
; dualshock4：DualShock 4 / PS4
; xbox_series：Xbox Series
; xbox_one：Xbox One（完全不安装 Hook）；旧 original 写法仍然兼容。
layout = dualsense

; 修改 layout 后需完全退出并重启游戏，不支持热切换或自动识别设备。
; 连线、高亮固定使用官方资源；不需要 assets，也没有 operating_lines 开关。

; 可选耗时诊断。基本加载与回退结果始终由后台记录；界面回调不写日志。
diagnostics = false
