name: Release draft

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Check version and tag
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"$').Matches.Groups[1].Value
          if (-not $version -or $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and verify both archives
        shell: pwsh
        run: |
          ./scripts/package.ps1
          ./scripts/package-source.ps1
          ./scripts/verify-package.ps1 -PackageDirectory "dist/EldenRingControllerUI-$env:PACKAGE_VERSION" -SourceArchive "dist/elden-ring-controller-ui-$env:PACKAGE_VERSION-source.zip"
      - name: Create draft without replacing existing releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runtime = "dist/EldenRingControllerUI-$env:PACKAGE_VERSION.zip"
          $source = "dist/elden-ring-controller-ui-$env:PACKAGE_VERSION-source.zip"
          gh release create $env:GITHUB_REF_NAME $runtime "$runtime.sha256" $source "$source.sha256" --draft --verify-tag --repo $env:GITHUB_REPOSITORY --title "Elden Ring Native Controller UI $env:PACKAGE_VERSION" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed; existing releases are never overwritten' }
